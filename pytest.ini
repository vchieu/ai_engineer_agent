[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; Mặc định khi chạy `pytest` KHÔNG kèm -m: bỏ qua nhóm integration (cần Docker
; daemon đang chạy). Trước đây thiếu addopts này khiến `pytest` trần chạy CẢ
; integration, mâu thuẫn với AGENTS.md (quy định mặc định nhanh cho pre-commit/CI
; là bỏ qua integration) và có thể khiến CI/pre-commit fail ở máy không có Docker.
; Chạy integration TƯỜNG MINH khi cần bằng: pytest -m integration
addopts = -m "not integration"

markers =
    integration: test cần Docker daemon đang chạy hoặc tài nguyên bên ngoài khác.
                 Chạy riêng nhóm này bằng: pytest -m integration
                 Chạy TẤT CẢ (bỏ qua addopts mặc định) bằng: pytest -m ""
