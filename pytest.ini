[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    integration: test cần Docker daemon đang chạy hoặc tài nguyên bên ngoài khác.
                 Chạy riêng nhóm này bằng: pytest -m integration
                 Bỏ qua nhóm này (mặc định khuyến nghị cho pre-commit/CI nhanh):
                 pytest -m "not integration"

; Mặc định khi chạy `pytest` không kèm -m: chạy TẤT CẢ (kể cả integration).
; AGENTS.md quy định: khi review/fix bug nhanh, chạy `pytest -m "not integration"`.
