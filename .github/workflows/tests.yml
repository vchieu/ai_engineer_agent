name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cài dependencies
        run: pip install -r requirements-dev.txt
      - name: Chạy unit test (không cần Docker)
        run: pytest -m "not integration" -q --cov=. --cov-report=term-missing

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cài dependencies
        run: pip install -r requirements-dev.txt
      - name: Pull Docker images cần thiết
        run: |
          docker pull python:3.11-slim
          docker pull node:20-slim
      - name: Chạy integration test (cần Docker)
        run: pytest -m integration -q
